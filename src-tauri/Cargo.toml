[package]
name = "dkoos-jarvis"
version = "0.1.0"
description = "A local-first AI engineering assistant"
authors = ["DKOO"]
edition = "2021"

[lib]
name = "dkoos_jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["process", "time", "sync", "fs", "io-util"] }
thiserror = "2"
url = "2"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
base64 = "0.22"
tempfile = "3"

[dev-dependencies]
